[package]
name = "spire-code"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spire coding/development domain — language/build-system modules, AST + HAL tooling, platform registry"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "spire-core"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }

# Spire
spire-actor = { workspace = true }
spire-core = { workspace = true }

# MCP protocol
rust-mcp-sdk = { workspace = true }
rust-mcp-transport = { workspace = true }
rust-mcp-schema = { workspace = true }

# UUID
uuid = { workspace = true }

# Glob pattern matching (for file search)
glob-match = "0.2"

# Async futures (BoxFuture in HAL tooling)
futures = "0.3"

# Logging (standalone binary)
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Home directory (tests + platform registry seeds)
dirs = "5"

once_cell = "1"

# Utilities
chrono = { workspace = true }

# SHA-256 hashing for manifest checksums
sha2 = "0.10"

# Regex (for parsing XML tool calls from DeepSeek / basic source parsing)
regex = "1"

# YAML — platform definition files (~/.spire/platforms/*.yaml seed)
serde_yaml = "0.9"

# Tree-sitter — AST parsing for source files
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-cpp = "0.23"

# Filesystem walking
walkdir = "2"

# CPU count detection (for generic build commands)
num_cpus = "1"

# Cargo metadata (for Rust project analysis)
cargo_metadata = "0.19"

[dev-dependencies]
tempfile = "3"
