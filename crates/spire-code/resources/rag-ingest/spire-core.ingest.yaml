# Application wisdom corpus: the spire-core library documentation (docs/*.md +
# README), ingested into the user-level KnowledgeStore. Sources are fetched
# from GitHub (cached) so this manifest is portable and version-controlled.
version: "1.0"
pipeline:
  name: Spire Core — architecture & API docs
  corpus: spire-core
  settings:
    chunk_size: 1800
    chunk_overlap: 120
    embedding_model: ""
  domains:
    - name: spire-core
      patterns:
        - "**/*.md"
  sources:
    - id: spire-core-docs
      type: github_repo
      enabled: true
      url: https://github.com/nature-sense/spire-core.git
      processing:
        parser: markdown
        # NOTE: bare file names — the include filter matches each file's
        # basename against absolute clone paths, so globs with a directory
        # prefix ("docs/**/*.md") never match; keep this list explicit.
        include_files:
          - "README.md"
          - "anti-patterns.md"
          - "api.md"
          - "architecture.md"
          - "best-practices.md"
          - "examples.md"
          - "rag.md"
          - "spatial.md"
          - "use-cases.md"
        exclude_paths:
          - "target/**"
          - "**/target/**"
