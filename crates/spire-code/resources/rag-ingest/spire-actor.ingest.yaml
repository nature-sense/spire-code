# Application wisdom corpus: the spire-actor library documentation (docs/*.md +
# README), ingested into the user-level KnowledgeStore. Sources are fetched
# from GitHub (cached) so this manifest is portable and version-controlled.
version: "1.0"
pipeline:
  name: Spire Actor — actor-model library docs
  corpus: spire-actor
  settings:
    chunk_size: 1800
    chunk_overlap: 120
    embedding_model: ""
  domains:
    - name: spire-actor
      patterns:
        - "**/*.md"
  sources:
    - id: spire-actor-docs
      type: github_repo
      enabled: true
      url: https://github.com/nature-sense/spire-actor.git
      processing:
        parser: markdown
        # NOTE: bare file names — the include filter matches each file's
        # basename against absolute clone paths, so globs with a directory
        # prefix ("docs/**/*.md") never match; keep this list explicit.
        include_files:
          - "README.md"
          - "01-concepts-and-architecture.md"
          - "02-api-reference.md"
          - "03-usage-and-examples.md"
          - "04-best-practices.md"
        exclude_paths:
          - "target/**"
          - "**/target/**"
