# spire-code monorepo workspace — the Rust crate lives in crates/spire-code/.
# External sibling repos (spire-actor, spire-core) are pulled in as path deps
# and must sit next to this repo:
#
#   /Users/steve/naturesense/spire/
#     ├── spire-actor/
#     ├── spire-code/
#     └── spire-core/

[workspace]
resolver = "2"
members = ["crates/spire-code"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async + error handling
async-trait = "0.1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# MCP protocol
rust-mcp-sdk = "1.0"
rust-mcp-transport = "0.9"
rust-mcp-schema = "0.10"

# UUID
uuid = { version = "1", features = ["v4"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }

# Spire — sibling repos, resolved by path (must exist next to this repo)
spire-actor = { path = "../spire-actor" }
spire-core = { path = "../spire-core" }
